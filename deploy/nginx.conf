# ==============================================================================
# Harsh Electronics - Production Nginx Reverse Proxy Configuration
# Target: AWS EC2 Ubuntu 22.04 / 24.04 LTS
# Location on Ubuntu: /etc/nginx/sites-available/harsh-electronics
# Enabled symlink: /etc/nginx/sites-enabled/harsh-electronics
# ==============================================================================

# Rate limiting zone for API protection
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=15r/s;

server {
    listen 80;
    listen [::]:80;
    
    # Replace with your EC2 public DNS / IP address or custom domain (e.g. harshelectronics.com)
    server_name _;

    # Maximum client payload size (for product image uploads)
    client_max_body_size 16M;

    # Root directory for static production build of Vite/React frontend
    root /var/www/harsh-electronics/client/dist;
    index index.html;

    # Gzip Compression for high performance and reduced bandwidth costs
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/rss+xml
        image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 1. Reverse Proxy for Backend REST API
    # Passes /api requests directly to Node.js / Express running on PM2 on 127.0.0.1:5000
    location /api/ {
        limit_req zone=api_limit burst=25 nodelay;

        # Forward to private local port
        proxy_pass http://127.0.0.1:5000;

        # Preserve client identification and protocol
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for API requests
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_cache_bypass $http_upgrade;
    }

    # 2. Static Assets Caching (Vite hashed bundles)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # 3. Client-Side SPA Routing Fallback
    # Ensures React Router routes (e.g. /products, /cart, /checkout, /admin) don't trigger 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Deny access to hidden files (e.g. .git, .env)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Custom Error Pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
